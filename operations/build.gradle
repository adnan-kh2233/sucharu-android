plugins {
    id 'com.android.application'
}

def sucharuApiBaseUrl = project.findProperty('sucharuApiBaseUrl') ?: 'https://sucharu-api.onrender.com/api'

android {
    namespace 'com.sucharu.operations'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sucharu.operations'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${sucharuApiBaseUrl}\""
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
}
